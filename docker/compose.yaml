name: retail-local

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: ${FLINK_TM_PROCESS_MEMORY:-1536m}
  taskmanager.memory.managed.fraction: ${FLINK_TM_MANAGED_FRACTION:-0.4}
  taskmanager.numberOfTaskSlots: 2
  parallelism.default: 2
  state.checkpoints.dir: file:///opt/flink/checkpoints

services:
  kafka-volume-init:
    image: apache/kafka:4.2.2
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec", "chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    network_mode: none
    restart: "no"

  kafka:
    image: apache/kafka:4.2.2
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "6"
      KAFKA_LOG_RETENTION_BYTES: "${KAFKA_LOG_RETENTION_BYTES:-134217728}"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 1280m
    networks: [retail]

  kafka-init:
    image: apache/kafka:4.2.2
    entrypoint:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic ${KAFKA_TOPIC:-retail.sales.transactions} \
          --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic ${KAFKA_TOPIC:-retail.sales.transactions}
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    networks: [retail]

  flink-checkpoint-init:
    image: retail-flink:2.2.1-local
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec", "chown -R 9999:9999 /opt/flink/checkpoints"]
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    network_mode: none
    restart: "no"

  flink-jobmanager:
    build: ./flink
    image: retail-flink:2.2.1-local
    command: jobmanager
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    mem_limit: 1152m
    networks: [retail]

  flink-taskmanager:
    build: ./flink
    image: retail-flink:2.2.1-local
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-checkpoint-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    mem_limit: ${FLINK_TM_MEM_LIMIT:-1792m}
    networks: [retail]

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retail_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-retail_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    networks: [retail]

networks:
  retail:
    driver: bridge

volumes:
  kafka_data:
  flink_checkpoints:
  postgres_data:
